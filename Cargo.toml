[package]
name = "grafana-tui"
version = "0.2.0"
authors = ["Ryan Craig <ryan.s.craig@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "A Grafana-like TUI for Prometheus"
license = "Apache-2.0"
repository = "https://github.com/infrashift/grafana-tui"
homepage = "https://infrashift.github.io/grafana-tui/"
publish = false
readme = "README.md"
keywords = ["tui", "prometheus", "grafana", "monitoring", "terminal"]
categories = ["command-line-utilities", "visualization", "development-tools"]
exclude = [".github/", "examples/demo/", "*.mp4", "*.webp"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = "4.5.44"
clap_mangen = "0.2.26"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
humantime = "2.3.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "brotli", "zstd", "rustls-tls"] }
resvg = "0.45.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.19"
directories = "5.0.1"
urlencoding = "2.1.3"
regex = "1.12.3"
time = "0.3.47"
serde-saphyr = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1.13", features = ["std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
