[package]
name = "grafana-tui"
version = "0.2.0"
authors = ["Ryan Craig <ryan.s.craig@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "A Grafana-like TUI for Prometheus"
license = "Apache-2.0"
repository = "https://github.com/infrashift/grafana-tui"
homepage = "https://infrashift.github.io/grafana-tui/"
publish = false
readme = "README.md"
keywords = ["tui", "prometheus", "grafana", "monitoring", "terminal"]
categories = ["command-line-utilities", "visualization", "development-tools"]
exclude = [".github/", "examples/demo/", "*.mp4", "*.webp"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = "4.5.44"
clap_mangen = "0.2.26"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
humantime = "2.3.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "brotli", "zstd", "rustls-tls"] }
resvg = "0.45.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.19"
directories = "5.0.1"
urlencoding = "2.1.3"
regex = "1.12.3"
time = "0.3.47"
serde-saphyr = "1"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1.13", features = ["std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# The Power of 10 lints (ADR-0002, ADR-0003). `make lint` runs clippy with
# -D warnings, so each lint at "warn" is a gate. A lint at "allow" waits for
# the refactor phase that clears it: the issue in the comment sets it to
# "warn" when the phase closes. The rules apply to production code only:
# clippy.toml and a cfg_attr in src/main.rs exempt the test code.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# R2: loop bounds.
infinite_loop = "warn"
while_float = "warn"
# R3: memory with a ceiling.
large_stack_arrays = "warn"
large_stack_frames = "warn"
# R4: short functions.
too_many_lines = "warn"
excessive_nesting = "warn"
too_many_arguments = "warn"
# R5: assertions.
missing_assert_message = "warn"
debug_assert_with_mut_call = "warn"
# R7: check each result.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
let_underscore_future = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
# R10: casts, indexing and lint suppressions.
indexing_slicing = "warn"
string_slice = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
